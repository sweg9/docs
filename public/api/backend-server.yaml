openapi: 3.1.0
info:
  title: backend-server
  version: 0.6.0
  x-status: draft
  description: "API between the resident's Dashboard (web app) and the backend server (FastAPI) on AWS EC2 (since 2026-11-20). The server keeps no records; it relays each call to the hub at home and answers 503 while the hub is offline. Draft derived from the proposal, section IV-A. Live updates are pushed over a WebSocket (`/ws/app`, session cookie) as `{kind, data}`: `control`, `mapping`, `routine` (a record changed), `scan`, `run.progress`, `run.result`, `notification`, and since 0.4.0 `situation` (a Situation), `visits` (`{visits: Visit[]}`) and `robot` (a Robot), and since 0.5.0 `robot.route` (a RobotRoute). The payloads of `run.progress`, `run.result`, `notification` and `robot.route` are the schemas RunProgress, Run, Notification and RobotRoute; a run's `run.progress` is sent before the `robot` event of the same step. 0.4.0 adds situations, visits, the robot, retry and leave from openapi/dashboard-proposed.yaml, and the demo scenarios. 0.5.0 merges the dashboard's proposal (live-demo docs/proposed-api.md): retry answers the new run and refuses at once what it cannot do, the resident's choice is kept with the run, run.progress has step codes and outcomes, a move order (POST /robot/route), GET /proactive, and a notification after every run of a high-risk device (C-03). 0.6.0 adds GET /map in the Dashboard's HomeLayout shape (live-demo src/api/proposed.ts) and PATCH /mappings/{mapping_id} from openapi/dashboard-proposed.yaml; its `mapping` event carries previous_device_id."
servers:
  - url: https://nova.example.com/api
    description: The server on AWS, through the ingress. The domain is still open
  - url: http://localhost:8000
    description: The server run directly, for tests
security:
  - session: []
tags:
  - name: Session
    description: Sign-in of the resident's app. Every other operation needs the session cookie.
  - name: Controls
    description: Controls found by recognition (FR-01).
  - name: Devices
    description: Devices the cloud found or created during mapping. The resident can correct them (FR-02, FR-06).
  - name: Mappings
    description: Which control operates which device (FR-02).
  - name: Routines
    description: Routines from habits or built by hand, and the resident's feedback (FR-04, FR-06).
  - name: Runs
    description: One action from trigger to result, and its log (FR-12).
  - name: Safety
    description: Emergency stop and pausing proactive features (FR-10).
  - name: Situations
    description: A trigger comes in, a plan is built device by device, wireless results come back, and the robot visits what wireless could not do (FR-05 to FR-09).
  - name: Robot
    description: What the robot is doing now (FR-09, FR-10).
  - name: Demo
    description: Fixed scenarios as a trigger source, for the Dashboard's development and the demo. The hub answers 404 unless it runs with --demo-scenarios.
paths:
  /login:
    post:
      tags: [Session]
      summary: Sign in
      description: Checks the resident's password and sets the session cookie (HttpOnly, Secure, SameSite=Strict, 30 days, renewed while used).
      x-requirements: [C-10]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '204':
          description: Signed in
          headers:
            Set-Cookie:
              schema: { type: string }
              description: The session cookie
        '401':
          description: Wrong password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: Too many wrong passwords; try again in a minute
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /logout:
    post:
      tags: [Session]
      summary: Sign out
      description: Ends the session for good and clears the cookie.
      x-requirements: [C-10]
      responses:
        '204':
          description: Signed out
  /me:
    get:
      tags: [Session]
      summary: Check the session
      description: The app calls this on start. 401 means it shows the sign-in screen.
      x-requirements: [C-10]
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          $ref: '#/components/responses/SignedOut'
  /controls:
    get:
      tags: [Controls]
      summary: List controls
      x-requirements: [FR-01]
      responses:
        '200':
          description: Controls
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Control' } }
  /devices:
    get:
      tags: [Devices]
      summary: List devices
      x-requirements: [FR-02]
      responses:
        '200':
          description: Devices
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Device' } }
  /devices/{device_id}:
    patch:
      tags: [Devices]
      summary: Correct a device
      description: The resident renames a device or changes its room or risk. A changed risk takes effect from the next run.
      x-requirements: [FR-02, FR-06]
      parameters:
        - name: device_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeviceUpdate' }
      responses:
        '200':
          description: Updated device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '404':
          description: Unknown device
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /mappings:
    get:
      tags: [Mappings]
      summary: List mappings
      x-requirements: [FR-02]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/MappingStatus' }
          description: Filter by status.
      responses:
        '200':
          description: Mappings
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Mapping' } }
  /mappings/{mapping_id}:
    patch:
      tags: [Mappings]
      summary: Change which device a control runs
      description: >
        The resident says which device the control really runs. The mapping goes back to Pending (C-08), so no
        routine runs it until a check or POST /mappings/{mapping_id}/confirm makes it Verified again. The live
        `mapping` event carries previous_device_id. The same device as now changes nothing.
      x-requirements: [FR-02]
      parameters:
        - name: mapping_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id]
              additionalProperties: false
              properties:
                device_id: { type: string }
      responses:
        '200':
          description: Updated mapping
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mapping' }
        '404':
          description: Unknown mapping (unknown_mapping) or device (unknown_device)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /mappings/{mapping_id}/confirm:
    post:
      tags: [Mappings]
      summary: Confirm a mapping
      description: The resident confirms a suggested mapping.
      x-requirements: [FR-02]
      parameters:
        - name: mapping_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated mapping
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mapping' }
        '404':
          description: Unknown mapping
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /mappings/{mapping_id}/reject:
    post:
      tags: [Mappings]
      summary: Reject a mapping
      description: The mapping becomes Rejected and is not used.
      x-requirements: [FR-02]
      parameters:
        - name: mapping_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Updated mapping
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Mapping' }
  /routines:
    get:
      tags: [Routines]
      summary: List routines
      x-requirements: [FR-04]
      responses:
        '200':
          description: Routines
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Routine' } }
    post:
      tags: [Routines]
      summary: Build a routine by hand
      x-requirements: [FR-04]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoutineCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Routine' }
        '409':
          description: The mapping is not Verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /routines/{routine_id}/feedback:
    post:
      tags: [Routines]
      summary: Give feedback on a routine
      description: Keep, change or remove a routine, or change how independently it acts.
      x-requirements: [FR-04, FR-06]
      parameters:
        - name: routine_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoutineFeedback' }
      responses:
        '200':
          description: Updated routine
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Routine' }
  /runs:
    get:
      tags: [Runs]
      summary: List runs with plain-language explanations
      x-requirements: [FR-12]
      parameters:
        - name: limit
          in: query
          schema: { type: integer }
          description: Number of recent runs.
      responses:
        '200':
          description: Runs, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Run' } }
  /stop:
    post:
      tags: [Safety]
      summary: Emergency stop
      description: Turns off the motors of the actuators at once and cancels the current run.
      x-requirements: [FR-10]
      responses:
        '200':
          description: Stopped
  /proactive:
    get:
      tags: [Safety]
      summary: Read whether proactive features are paused
      x-requirements: [FR-06]
      responses:
        '200':
          description: Setting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProactiveSetting' }
    put:
      tags: [Safety]
      summary: Pause or resume proactive features
      x-requirements: [FR-06]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProactiveSetting' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProactiveSetting' }
  /situations:
    get:
      tags: [Situations]
      summary: Situations, newest first (the last 50)
      x-requirements: [FR-05, FR-06]
      responses:
        '200':
          description: Situations
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Situation' } }
  /situations/{situation_id}:
    get:
      tags: [Situations]
      summary: One situation with its plan
      x-requirements: [FR-05, FR-06]
      parameters: [{ $ref: '#/components/parameters/situation_id' }]
      responses:
        '200':
          description: Situation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Situation' }
        '404': { $ref: '#/components/responses/NotFound' }
  /situations/{situation_id}/approve:
    post:
      tags: [Situations]
      summary: Answer yes to a situation that waits for an answer (decision ask)
      x-requirements: [FR-06]
      parameters: [{ $ref: '#/components/parameters/situation_id' }]
      responses:
        '200':
          description: Situation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Situation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /situations/{situation_id}/dismiss:
    post:
      tags: [Situations]
      summary: Answer no to a situation that waits for an answer; nothing is done
      x-requirements: [FR-06]
      parameters: [{ $ref: '#/components/parameters/situation_id' }]
      responses:
        '200':
          description: Situation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Situation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /visits:
    get:
      tags: [Situations]
      summary: The robot's visit order (devices wireless could not do, and retries)
      x-requirements: [FR-07, FR-09]
      responses:
        '200':
          description: Visits
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Visit' } }
  /robot:
    get:
      tags: [Robot]
      summary: The robot's state, last spot, current task and stops ahead
      x-requirements: [FR-09, FR-10]
      responses:
        '200':
          description: Robot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Robot' }
  /map:
    get:
      tags: [Robot]
      summary: The home as the Dashboard draws it, for the map and the robot's route
      description: >
        Centimetres on the floor, x to the right, y down, seen from above. Each control stands at its spot;
        `spot_id` is the id Robot.spot_id, Visit.spot_id and RobotRoute use, and the dock's spot is `dock`. Names,
        kinds, states, statuses and risk come from the lists (GET /controls, /devices, /mappings). A control or
        device whose position is not known yet is left out. Numbers only, no photos (C-05). The positions of the
        demo home are estimates until the map team marks them on the scan.
      x-requirements: [FR-09]
      responses:
        '200':
          description: HomeLayout
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeLayout' }
  /robot/route:
    post:
      tags: [Robot]
      summary: Send the robot to one place, or through several in order ("go here", "stop by here, then there")
      description: >
        Moving only; nothing is pressed. Each stop is a spot id, a control id (its press spot) or a device id
        (the press spot of the control its Verified mapping runs, C-08). The safety gate is checked before every
        leg (C-04); a failed gate ends the order as cancelled with the reason. Progress comes as `robot.route`;
        the emergency stop cancels it. 409 while the robot is busy (codes robot_busy, not_verified, no_press_spot).
      x-requirements: [FR-09, FR-10]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RouteOrder' }
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema:
                type: object
                required: [route_id, stops]
                properties:
                  route_id: { type: string }
                  stops: { type: array, items: { type: string }, description: The stops as spot ids, in order }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /runs/{run_id}/retry:
    post:
      tags: [Runs]
      summary: Try a failed, unsure or cancelled run again by pressing
      description: >
        The resident's choice after a failure (C-09). A new run starts at once, `retry_run_id` in the answer,
        and the robot visits the press spot. 409 when the run succeeded, the resident already chose, the robot
        is busy, or the device has no Verified mapping any more (codes not_failed, already_chosen, robot_busy,
        not_verified).
      x-requirements: [FR-11]
      parameters: [{ $ref: '#/components/parameters/run_id' }]
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Choice' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /runs/{run_id}/leave:
    post:
      tags: [Runs]
      summary: Leave a failed, unsure or cancelled run as it is
      x-requirements: [FR-11]
      parameters: [{ $ref: '#/components/parameters/run_id' }]
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Choice' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /scenarios:
    get:
      tags: [Demo]
      summary: The demo scenarios
      responses:
        '200':
          description: Scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, description]
                  properties: { name: { type: string }, description: { type: string } }
        '404': { $ref: '#/components/responses/NotFound' }
  /scenarios/{name}/start:
    post:
      tags: [Demo]
      summary: Play a demo scenario (new_control, one_press, leave_home)
      description: Fixed answers stand in for the sensors, the enclave, the wireless platforms and the camera; the runs, records and events are the hub's own. Watch it on /ws/app.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: speed, in: query, schema: { type: number, minimum: 0.1, maximum: 20 }, description: 2 plays twice as fast }
      responses:
        '202':
          description: Started
          content:
            application/json:
              schema:
                type: object
                required: [started, speed]
                properties: { started: { type: string }, speed: { type: number } }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: session
      description: Set by POST /login. Also required by the app's WebSocket.
  parameters:
    situation_id: { name: situation_id, in: path, required: true, schema: { type: string } }
    run_id: { name: run_id, in: path, required: true, schema: { type: string } }
  responses:
    NotFound:
      description: Unknown id
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Not possible now (robot busy, not waiting, already chosen)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    SignedOut:
      description: No valid session cookie
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Login:
      type: object
      required: [password]
      properties:
        password: { type: string, format: password }
    Me:
      type: object
      required: [expires_at]
      properties:
        expires_at: { type: string, format: date-time }
    ControlKind:
      type: string
      enum: [switch, toggle, power_strip]
    Control:
      type: object
      required: [control_id, kind, state, position]
      properties:
        control_id: { type: string }
        kind: { $ref: '#/components/schemas/ControlKind' }
        state: { type: string, enum: ['on', 'off', unknown] }
        actions: { type: array, items: { type: string, enum: [press, flip, turn] } }
        position: { type: array, items: { type: number }, description: Point on the panel }
        seen_at: { type: string, format: date-time }
    MappingStatus:
      type: string
      enum: [Pending, Verified, Rejected, Stale]
    Mapping:
      type: object
      required: [mapping_id, control_id, device_id, status, confidence]
      properties:
        mapping_id: { type: string }
        control_id: { type: string }
        device_id: { type: [string, 'null'], description: Null while Pending when the device detector found no device; the app asks the resident which device it is }
        status: { $ref: '#/components/schemas/MappingStatus' }
        confidence: { type: number, description: 0 to 1 }
    Device:
      type: object
      required: [device_id, name, type, room, risk]
      properties:
        device_id: { type: string }
        name: { type: string }
        type: { type: string }
        room: { type: string }
        risk: { type: string, enum: [low, high] }
        channels: { type: array, items: { type: string, enum: [IR, WIFI, BT, ARM] } }
    DeviceUpdate:
      type: object
      properties:
        name: { type: string }
        room: { type: string }
        risk: { type: string, enum: [low, high] }
    Independence:
      type: string
      enum: [act_and_tell, ask_first, suggest_only]
    Routine:
      type: object
      required: [routine_id, mapping_id, action, independence, priority]
      properties:
        routine_id: { type: string }
        mapping_id: { type: string }
        action: { type: string, enum: ['on', 'off'] }
        time: { type: string, description: 'Time of day, for example "21:00"' }
        source: { type: string, enum: [habit, manual] }
        independence: { $ref: '#/components/schemas/Independence' }
        priority: { type: number }
    RoutineCreate:
      type: object
      required: [mapping_id, action]
      properties:
        mapping_id: { type: string }
        action: { type: string, enum: ['on', 'off'] }
        time: { type: string }
        independence: { $ref: '#/components/schemas/Independence' }
    RoutineFeedback:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [keep, change, remove] }
        time: { type: string, description: New time when the decision is change }
        independence: { $ref: '#/components/schemas/Independence' }
    Run:
      type: object
      required: [run_id, trigger, result, started_at]
      properties:
        run_id: { type: string }
        trigger: { type: string, enum: [sensor, time, routine] }
        situation_id: { type: [string, 'null'], description: The situation the run came from }
        intent: { type: string }
        device_id: { type: string }
        confidence: { type: number }
        channel: { type: string, enum: [IR, WIFI, BT, ARM] }
        result: { type: string, enum: [success, failure, unsure, cancelled] }
        reason: { type: string, description: Reason for a cancellation }
        explanation: { type: string, description: Plain-language sentence for the resident }
        started_at: { type: string, format: date-time }
        resolution:
          description: What the resident chose after a failed, unsure or cancelled run; null until then
          oneOf:
            - type: 'null'
            - type: object
              required: [choice, retry_run_id]
              properties:
                choice: { type: string, enum: [retry, leave] }
                retry_run_id: { type: [string, 'null'], description: The run the retry started }
        retry_of: { type: [string, 'null'], description: The run this one tried again }
    ProactiveSetting:
      type: object
      required: [paused]
      properties:
        paused: { type: boolean }
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        reason: { type: string }
    Situation:
      type: object
      required: [situation_id, kind, trigger, summary, received_at, status, plan]
      properties:
        situation_id: { type: string }
        kind: { type: string, description: 'For example leave_home' }
        trigger: { type: string, enum: [sensor, time, routine] }
        summary: { type: string, description: Plain-language sentence }
        received_at: { type: string, format: date-time }
        status: { type: string, enum: [received, planning, waiting_for_answer, running, done, needs_attention, suggested, dismissed, cancelled] }
        plan: { type: array, items: { $ref: '#/components/schemas/PlanItem' } }
    PlanItem:
      type: object
      required: [device_id, mapping_id, action, decision, confidence, method, wireless]
      properties:
        device_id: { type: string }
        name: { type: string }
        room: { type: string }
        risk: { type: string, enum: [low, high] }
        mapping_id: { type: string }
        routine_id: { type: [string, 'null'], description: The routine it came from; null when made for this situation }
        action: { type: string, enum: ['on', 'off'] }
        decision: { type: string, enum: [act, ask, suggest] }
        confidence: { type: number }
        method: { type: string, enum: [wireless, press], description: press once wireless failed or there is no channel }
        wireless:
          type: object
          required: [channel, result]
          properties:
            channel: { type: [string, 'null'], enum: [IR, WIFI, BT, null] }
            result: { type: string, enum: [pending, success, failure, no_channel] }
            reason: { type: [string, 'null'] }
        run_id: { type: [string, 'null'] }
        result: { type: [string, 'null'], enum: [success, failure, unsure, cancelled, null] }
        reason: { type: [string, 'null'] }
        resolution: { type: [string, 'null'], enum: [retry, leave, null] }
    Point:
      type: object
      required: [x, y]
      properties:
        x: { type: number, description: cm, to the right }
        y: { type: number, description: cm, down }
    HomeLayout:
      type: object
      required: [rooms, controls, devices, dock]
      properties:
        rooms:
          type: array
          items:
            type: object
            required: [room, x, y, w, h]
            properties:
              room: { type: string }
              x: { type: number }
              y: { type: number }
              w: { type: number }
              h: { type: number }
              label: { type: boolean, description: false to leave the name out (a second box of the same room) }
        controls:
          type: array
          items:
            type: object
            required: [control_id, at, press_spot, spot_id]
            properties:
              control_id: { type: string }
              at: { $ref: '#/components/schemas/Point' }
              press_spot: { $ref: '#/components/schemas/Point' }
              spot_id: { type: string }
        devices:
          type: array
          items:
            type: object
            required: [device_id, at]
            properties:
              device_id: { type: string }
              at: { $ref: '#/components/schemas/Point' }
        dock: { $ref: '#/components/schemas/Point' }
        walls:
          type: array
          description: Straight walls [x1, y1, x2, y2, thickness]; gaps are doors
          items: { type: array, items: { type: number }, minItems: 5, maxItems: 5 }
        furniture:
          type: array
          items:
            type: object
            required: [kind, x, y, w, d, h]
            properties:
              kind: { type: string, enum: [bed, desk, wardrobe, shelf] }
              x: { type: number }
              y: { type: number }
              w: { type: number }
              d: { type: number }
              h: { type: number, description: height in cm }
        ceiling: { type: number, description: ceiling height in cm }
    Visit:
      type: object
      required: [visit_id, order, spot_id, device_id, reason, status]
      properties:
        visit_id: { type: string }
        order: { type: integer, minimum: 1 }
        situation_id: { type: [string, 'null'] }
        spot_id: { type: string }
        control_id: { type: [string, 'null'] }
        device_id: { type: string }
        run_id: { type: [string, 'null'] }
        reason: { type: string, enum: [no_channel, wireless_failed, requested] }
        status: { type: string, enum: [waiting, moving, pressing, checking, done, failed, cancelled] }
    Robot:
      type: object
      required: [state, spot_id, task, plan, ral]
      properties:
        state: { type: string, enum: [idle, moving, scanning, watching, pressing, checking, stopped] }
        spot_id: { type: string, description: Last spot reached }
        task:
          type: [object, 'null']
          properties:
            run_id: { type: [string, 'null'] }
            device_id: { type: [string, 'null'] }
            stage: { type: [string, 'null'], enum: [S1, S2, S3, S4, S5, S6, S7, null] }
            step: { $ref: '#/components/schemas/Step' }
            text: { type: string, description: Plain words, for example "safety gate - no person in the work area" }
            method: { type: [string, 'null'], enum: [wireless, press, null] }
            channel: { type: [string, 'null'], enum: [IR, WIFI, BT, ARM, null] }
        plan: { type: array, items: { type: string }, description: Spots still ahead, in order }
        ral:
          type: object
          required: [impl, state]
          properties:
            impl: { type: string, enum: [linear_actuators, unity_sim, script] }
            state: { type: string, enum: [idle, busy, stopped, error] }
    Choice:
      type: object
      required: [run_id, choice, retry_run_id]
      properties:
        run_id: { type: string }
        choice: { type: string, enum: [retry, leave] }
        retry_run_id: { type: [string, 'null'], description: The new run, for retry }
    Step:
      type: string
      enum: [decide, wireless, queued, move, gate, press, check]
      description: 'S4: decide. S5: wireless. S6: queued (waits for the robot), move, gate, press, check'
    RunProgress:
      type: object
      description: Payload of `run.progress`, one step of one run. The outcome fields are present when they apply
      required: [run_id, situation_id, device_id, stage, step, text, method, channel]
      properties:
        run_id: { type: string }
        situation_id: { type: [string, 'null'] }
        device_id: { type: string }
        stage: { type: string, enum: [S4, S5, S6] }
        step: { $ref: '#/components/schemas/Step' }
        text: { type: string, description: Plain words for the screen }
        method: { type: [string, 'null'], enum: [wireless, press, null] }
        channel: { type: [string, 'null'], enum: [IR, WIFI, BT, ARM, null] }
        wireless: { type: string, enum: [success, failure, no_channel], description: 'Step wireless: the outcome' }
        gate: { type: string, enum: [pass, fail], description: 'Step gate: whether the safety gate passed (C-04)' }
        answer: { type: string, enum: ['yes', 'no', unsure], description: 'Steps wireless and check: the platform or camera answer' }
        reason: { type: [string, 'null'] }
    RouteOrder:
      type: object
      required: [stops]
      properties:
        stops: { type: array, minItems: 1, maxItems: 10, items: { type: string }, description: Spot, control or device ids, in order }
    RobotRoute:
      type: object
      description: Payload of `robot.route`, sent when the order starts, at every stop reached and when it ends
      required: [route_id, stops, reached, state, reason]
      properties:
        route_id: { type: string }
        stops: { type: array, items: { type: string }, description: Spot ids, in order }
        reached: { type: integer, minimum: 0, description: Stops arrived at }
        state: { type: string, enum: [moving, done, cancelled] }
        reason: { type: [string, 'null'], description: Why it was cancelled }
    Notification:
      type: object
      description: Payload of `notification`. Topics include situation, question, suggestion, run_failed, high_risk_run (C-03), left_as_is, route_cancelled and stop
      required: [level, topic, message, at]
      properties:
        level: { type: string, enum: [info, warning] }
        topic: { type: string }
        message: { type: string, description: From fixed sentence templates (C-07) }
        at: { type: string, format: date-time }
        choices: { type: array, items: { type: string, enum: [retry, leave, approve, dismiss] } }
        run_id: { type: [string, 'null'] }
        device_id: { type: [string, 'null'] }
        situation_id: { type: [string, 'null'] }
        route_id: { type: string }
